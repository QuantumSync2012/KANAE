# hs-id-registry — 調和的主観主義 stable ID台帳
# v1.0.0で公開し、v1.1.1で漢字調査の内部工程状態を公開台帳から分離したstable ID台帳。概念ページの増補とは独立に、採番履歴を保つ。
# v1.2.0で客鼎観・源則・自在・吟味の定義改訂に伴いactive_revisionを更新。v1.2.2で自在を再改訂。
# retiredは永続tombstone・ID再利用禁止・削除不可。
registry_id: hs-id-registry
registry_version: 0.0.1
status: active
created: 2026-08-14T15:35:00+0900
updated: 2026-09-26T03:54:26+0900
owner_writer: repository maintainer
validator: scripts/validate_structure.rb

namespaces_managed_here: [HS-C, HS-P, HS-Q, HS-G, HS-CMP, HS-H]
namespaces_external_conversation:
  namespaces: [HS-EV, HS-DLG]
  authority: private evidence registry (not published)
  note: 公開可能になったQ&A・guide章はHS-Q/HS-Gで採番する
namespaces_reserved_existing:
  HS-R:
    grandfathered: [HS-R-DING-0001]          # 現形式のまま有効
    new_issuance_grammar: "HS-R-[A-Z]+-\\d{4}"
    new_issuance_authority: this registry; maintained by repository maintainers and checked by scripts/validate_structure.rb

pilot_selection:
  status: neo_approved_schema_pilot
  scope: schema_validation_only
  not_a_priority_ranking: true                 # 重要概念上位10件ではない
  not_full_v1_scope: true                      # 公開版の全収録範囲ではない
  proposed_active_ids: [HS-C-0001, HS-C-0002, HS-C-0003, HS-C-0004, HS-C-0005, HS-C-0006, HS-C-0007, HS-C-0008, HS-C-0009, HS-C-0011]
  excluded_from_pilot: [HS-C-0010, HS-C-0012]  # retired tombstone（自由意志・批判的思考）はpilot集合に含めない
  decision_ref:
    receipt_type: neo_decision_receipt
    receipt_id: NDR-HS-20260814-002
    subject: active 10概念pilotのscope境界
    sha256: b4e1c17e45d406ae882f696661d00bc472711720f5419e0d62f7bcb2995dbd88

validator_checks:
  - id_uniqueness
  - grammar_conformance_per_namespace
  - tombstone_permanence_no_id_reuse
  - supersede_bidirectional_presence
  - supersede_no_self_reference
  - supersede_acyclic

